# One command: docker compose up --build
#   app      http://localhost:8000      LeadDesk itself
#   mailpit  http://localhost:8025      every invite, reminder and cancellation lands here
#   ollama   http://ollama:11434        the local model, pulled automatically on first run
services:
  app:
    build: .
    container_name: leaddesk-app
    ports:
      - "8000:8000"
    environment:
      # Ollama runs as a service in this compose file; override OLLAMA_URL to use a host install.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      TEST_REPORT_EMAIL: ${TEST_REPORT_EMAIL:-leaddesk-test@localhost}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SEED_DEMO: ${SEED_DEMO:-1}
      DEMO_MODE: ${DEMO_MODE:-1}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      DATA_DIR: /app/data
      VAULT_MASTER_KEY_FILE: /app/secrets/vault_master.key
      VAULT_AUTOCREATE_KEY: "1"
    volumes:
      - ./data:/app/data          # database + encrypted blobs
      - ./secrets:/app/secrets    # vault master key — keep this out of git
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Linux hosts resolve a host Ollama if you override OLLAMA_URL
    depends_on:
      - mailpit
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: leaddesk-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "30m"      # keep the model warm so testers do not wait for a cold load
      OLLAMA_NUM_PARALLEL: "2"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: makes sure the model exists. Re-running this is cheap when it is already pulled.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: leaddesk-ollama-pull
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen2.5:3b}"]

  mailpit:
    image: axllent/mailpit:latest
    container_name: leaddesk-mail
    ports:
      - "8025:8025"   # web inbox for the demo
      - "1025:1025"   # SMTP
    restart: unless-stopped

volumes:
  ollama_models:

