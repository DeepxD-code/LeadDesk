# Production compose: app behind Caddy, no Mailpit, app not exposed directly.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Requires a .env next to the repository root with at least DOMAIN and
# PUBLIC_BASE_URL, and DEMO_MODE=0. See docs/DEPLOY.md.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: leaddesk-app
    restart: unless-stopped
    # Only Caddy can reach the app. Nothing on the internet talks to 8000 directly.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TEST_REPORT_EMAIL: ${TEST_REPORT_EMAIL:-leaddesk-test@localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-LeadDesk <scheduler@localhost>}
      SEED_DEMO: ${SEED_DEMO:-0}
      DEMO_MODE: ${DEMO_MODE:-0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      DATA_DIR: /app/data
      VAULT_MASTER_KEY_FILE: /app/secrets/vault_master.key
      VAULT_AUTOCREATE_KEY: "1"
      VAULT_MASTER_KEY_COMMAND: ${VAULT_MASTER_KEY_COMMAND:-}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-0}
      AUDIT_SHIP_FILE: ${AUDIT_SHIP_FILE:-}
      AUDIT_SHIP_URL: ${AUDIT_SHIP_URL:-}
      AUDIT_ALERT_WEBHOOK: ${AUDIT_ALERT_WEBHOOK:-}
      AUDIT_ALERT_DENIAL_THRESHOLD: ${AUDIT_ALERT_DENIAL_THRESHOLD:-5}
      AUDIT_ALERT_WINDOW_MINUTES: ${AUDIT_ALERT_WINDOW_MINUTES:-15}
    volumes:
      - ../data:/app/data
      - ../secrets:/app/secrets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - clamav
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: leaddesk-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "2"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot pull so a fresh deploy is useful before anyone opens the assistant.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: leaddesk-ollama-pull
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen2.5:3b}"]

  clamav:
    image: clamav/clamav:stable
    container_name: leaddesk-clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav

  caddy:
    image: caddy:2-alpine
    container_name: leaddesk-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  clamav_db:
  ollama_models:
