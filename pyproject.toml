[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "secrets", ".venv"]

# A deliberately narrow rule set: the rules that catch real mistakes (unused
# imports, unused variables, undefined names, import order) without flagging the
# patterns FastAPI is built around. `Depends(...)` in an argument default is the
# documented FastAPI style, so B008 is the one rule that would be pure noise here.
[tool.ruff.lint]
select = ["F", "E9", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["F401"]
