services:
  - type: web
    name: leaddesk-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: DEMO_MODE
        value: "1"
      - key: SEED_DEMO
        value: "1"
      - key: VAULT_AUTOCREATE_KEY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
